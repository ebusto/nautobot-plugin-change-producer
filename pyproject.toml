[tool.poetry]
authors     = ["Eric Busto <ebusto@nvidia.com>"]
description = "Publish changes to NATS"
name        = "nautobot-change-producer"
packages    = [{include = "nautobot_change_producer"}]
readme      = "README.md"
version     = "2.1.5"

[tool.poetry.dependencies]
dictdiffer = "^0.9.0"
nats-py    = "^2.9.0"
nkeys      = "^0.2.1"
orjson     = "^3.10.14"
python    = ">=3.10,<4.0"

[build-system]
build-backend = "poetry.core.masonry.api"
requires      = ["poetry-core"]
